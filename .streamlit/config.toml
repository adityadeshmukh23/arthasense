[server]
headless = true
enableXsrfProtection = true
# Keep in sync with _MAX_UPLOAD_MB in app.py
maxUploadSize = 10

[browser]
# Don't send usage telemetry from users' browsers to Streamlit
gatherUsageStats = false

[theme]
base = "dark"
primaryColor = "#0F766E"
backgroundColor = "#0F1513"
secondaryBackgroundColor = "#19221F"
textColor = "#E6EDEA"
font = "sans serif"
